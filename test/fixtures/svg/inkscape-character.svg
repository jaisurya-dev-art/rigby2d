<?xml version="1.0" encoding="UTF-8"?>
<!-- A tiny character as Inkscape saves it: layers in mm, a sublayer, a hidden layer, a stray shape. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="80mm" height="120mm" viewBox="0 0 80 120">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" />
  <defs>
    <linearGradient id="skin"><stop offset="0" stop-color="#f2c29b" /><stop offset="1" stop-color="#d9946a" /></linearGradient>
  </defs>
  <ellipse id="shadow" cx="40" cy="116" rx="22" ry="3" fill="#000" fill-opacity="0.25" />
  <g inkscape:groupmode="layer" id="layer1" inkscape:label="legs">
    <rect x="28" y="78" width="9" height="34" rx="4" fill="#3b4a6b" />
    <rect x="43" y="78" width="9" height="34" rx="4" fill="#3b4a6b" />
  </g>
  <g inkscape:groupmode="layer" id="layer2" inkscape:label="body">
    <rect x="24" y="44" width="32" height="40" rx="8" fill="#e05a47" />
  </g>
  <g inkscape:groupmode="layer" id="layer3" inkscape:label="arms">
    <g inkscape:groupmode="layer" id="layer3a" inkscape:label="arm left">
      <rect x="14" y="46" width="9" height="30" rx="4" fill="url(#skin)" />
    </g>
    <g inkscape:groupmode="layer" id="layer3b" inkscape:label="arm right" transform="rotate(-10 61 48)">
      <rect x="57" y="46" width="9" height="30" rx="4" fill="url(#skin)" />
    </g>
  </g>
  <g inkscape:groupmode="layer" id="layer4" inkscape:label="head">
    <circle cx="40" cy="28" r="17" fill="url(#skin)" />
    <circle cx="34" cy="26" r="2.2" fill="#222" />
    <circle cx="46" cy="26" r="2.2" fill="#222" />
  </g>
  <g inkscape:groupmode="layer" id="layer5" inkscape:label="hat (spare)" style="display:none">
    <path d="M22 16 L40 0 L58 16 Z" fill="#6b3bb5" />
  </g>
</svg>
