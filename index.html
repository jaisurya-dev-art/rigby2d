<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigby2D</title>
    <link rel="icon" type="image/svg+xml" href="/branding/rigby2d-icon-dark.svg" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>
      <aside id="dock-left" class="dock-region" data-region="left"></aside>
      <div id="split-left" class="split-v"></div>
      <main id="center" data-tut="viewport">
        <canvas id="viewport-gl"></canvas>
        <canvas id="viewport"></canvas>
        <div id="viewbar"></div>
      </main>
      <div id="split-right" class="split-v"></div>
      <aside id="dock-right" class="dock-region" data-region="right"></aside>
      <div id="split-bottom" class="split-h"></div>
      <div id="dock-bottom" class="dock-region" data-region="bottom"></div>
      <footer id="status"><span id="status-text"></span><span class="status-right"><span id="status-info"></span><button id="status-community" title="Discord: show your work, get help, hear about every release" data-i18n-title>Discord</button><button data-i18n id="status-log" title="Show the log (View ▸ Log)" data-i18n-title>Log</button><button id="status-version" title="About Rigby2D" data-i18n-title></button></span></footer>
      <!-- The panels: the dock (dockui.js) moves each into its tab group. -->
      <div id="dock-parking" hidden>
        <section id="tree" class="panel" data-tut="tree"></section>
        <section id="rig" class="panel" data-tut="rig"></section>
        <section id="properties" class="panel" data-tut="inspector"><div class="content scroll"></div></section>
        <section id="timeline" data-tut="timeline">
          <div id="controls"></div>
          <div class="dopesheet-wrap">
            <div data-i18n class="empty">No animation. Press ＋ New or Tab to start animating.</div>
            <div id="dopesheet"><canvas></canvas></div>
            <div id="graph" hidden><canvas></canvas></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>
