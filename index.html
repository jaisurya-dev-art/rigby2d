<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigby2D</title>
    <link rel="icon" type="image/svg+xml" href="/branding/rigby2d-icon-dark.svg" />
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>
      <main id="center" data-tut="viewport">
        <canvas id="viewport-gl"></canvas>
        <canvas id="viewport"></canvas>
        <div id="viewbar"></div>
      </main>
      <div id="split-right" class="split-v"></div>
      <aside id="side">
        <button class="panel-detach-btn" data-panel="tree" title="Pop out the bone tree into its own window" hidden>⧉</button>
        <section id="tree" class="panel" data-tut="tree"></section>
        <div id="split-tree" class="split-h"></div>
        <section id="properties" class="panel" data-tut="inspector"><button class="panel-detach-btn" data-panel="inspector" title="Pop out the inspector into its own window" hidden>⧉</button><div class="content scroll"></div></section>
      </aside>
      <div id="split-bottom" class="split-h"></div>
      <section id="timeline" data-tut="timeline">
        <button class="panel-detach-btn" data-panel="timeline" title="Pop out the timeline into its own window" hidden>⧉</button>
        <div id="controls"></div>
        <div class="dopesheet-wrap">
          <div class="empty">No animation. Press ＋ New or Tab to start animating.</div>
          <div id="dopesheet"><canvas></canvas></div>
          <div id="graph" hidden><canvas></canvas></div>
        </div>
      </section>
      <footer id="status"><span id="status-text"></span><span class="status-right"><span id="status-info"></span><button id="status-log" title="Show the log (View ▸ Log)">Log</button></span></footer>
    </div>
    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>
