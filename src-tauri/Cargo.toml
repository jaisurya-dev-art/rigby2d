# Native shell only: hosts the web UI in a window and exposes the dialog/fs plugins.
# All editor logic lives in ../src (JavaScript).
[package]
name = "rigby2d"
version = "0.4.2"
description = "Rigby2D: open-source 2D skeletal animation for games, films and interactive experiences."
license = "MIT OR Apache-2.0"
authors = ["jaisurya-dev-art"]
repository = "https://github.com/jaisurya-dev-art/rigby2d"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
