# Rigby2D native runtimes: the Rust core and engine integrations.
[workspace]
resolver = "2"
members = ["rigby-runtime", "rigby-godot", "rigby-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["jaisurya-dev-art"]
repository = "https://github.com/jaisurya-dev-art/rigby2d"

[profile.release]
lto = "thin"
codegen-units = 1
