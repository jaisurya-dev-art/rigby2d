# The runtimes must play every animation like the JavaScript runtime (src/core), frame by frame.
# Golden files record the JavaScript runtime's output (bone matrices, drawables, draw order, events);
# the Rust, C++ (Defold) and Python (Ren'Py) runtimes replay them. Besides the checked-in files, golden data is
# generated here from every exported demo skeleton, in JSON and binary form.
name: Runtimes

on:
  push:
    branches: [develop, main]
    paths: ['src/core/**', 'runtimes/**', 'branding/**/export/**', '.github/workflows/runtimes.yml']
  pull_request:
    paths: ['src/core/**', 'runtimes/**', 'branding/**/export/**', '.github/workflows/runtimes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Golden data from the demo skeletons
        run: |
          mkdir -p "$RUNNER_TEMP/golden"
          cd runtimes/rust/rigby-runtime/tests/golden
          for f in branding/nila/export/nila.json branding/nila/export/nila.skel branding/rigbytron/export/rigbytron.json test/fixtures/ik-stretch.json; do
            node generate.mjs "$RUNNER_TEMP/golden/$(basename "$f" | tr . _).golden.json" "$GITHUB_WORKSPACE/$f" "$(basename "$f")"
          done
      - name: Rust runtime
        working-directory: runtimes/rust
        env:
          RIGBY_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: cargo test --release -p rigby-runtime
      - name: C++ runtime (Defold)
        env:
          RIGBY_GOLDEN_DIR: ${{ runner.temp }}/golden
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -I runtimes/defold/rigby2d/include \
            runtimes/defold/test/golden.cpp runtimes/defold/rigby2d/commonsrc/rigby_*.cpp -o "$RUNNER_TEMP/golden-cpp"
          "$RUNNER_TEMP/golden-cpp" "$GITHUB_WORKSPACE"
      - name: C++ runtime (SDL3)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I runtimes/sdl3/include -I runtimes/defold/rigby2d/include             runtimes/sdl3/test/geometry.cpp runtimes/defold/rigby2d/commonsrc/rigby_*.cpp -o "$RUNNER_TEMP/geometry-sdl3"
          "$RUNNER_TEMP/geometry-sdl3" "$GITHUB_WORKSPACE"
          # Build the layer and the example player against SDL3 itself, built from source.
          git clone --depth 1 --branch release-3.2.0 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel
          cmake --install "$RUNNER_TEMP/SDL/build" --prefix "$RUNNER_TEMP/sdl3"
          cmake -S runtimes/sdl3 -B "$RUNNER_TEMP/rigby-sdl3" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3" -DRIGBY_SDL_IMAGE=OFF
          cmake --build "$RUNNER_TEMP/rigby-sdl3" --parallel
      - name: Python runtime (Ren'Py)
        run: |
          node runtimes/renpy/tests/make_golden.mjs --large "$RUNNER_TEMP/golden-py"
          RIGBY_GOLDEN_DIR="$RUNNER_TEMP/golden-py" python3 -m unittest discover -s runtimes/renpy/tests
