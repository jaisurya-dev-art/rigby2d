name: Validate Agent Skills

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate installable agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Detect skills
        id: detect
        shell: bash
        run: |
          if find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print -quit 2>/dev/null | grep -q .; then
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
            echo "No skills/<name>/SKILL.md files found; skipping skill checks."
          fi
      - name: Validate skill files
        if: steps.detect.outputs.has_skills == 'true'
        run: npm run skills:validate
      - name: Check skills.sh discovery
        if: steps.detect.outputs.has_skills == 'true'
        run: npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent codex -g --list -y
      - name: Check global installation
        if: steps.detect.outputs.has_skills == 'true'
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT
          HOME="$temp_home" USERPROFILE="$temp_home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent codex -g --copy -y
          while IFS= read -r skill_file; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            test -f "$temp_home/.agents/skills/$skill/SKILL.md"
          done < <(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print)
      - name: Check Claude Code global installation
        if: steps.detect.outputs.has_skills == 'true'
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT
          HOME="$temp_home" USERPROFILE="$temp_home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent claude-code -g --copy -y
          while IFS= read -r skill_file; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            find "$temp_home" -type f -path "*/$skill/SKILL.md" -print -quit | grep -q .
          done < <(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print)
      - name: Check project installation
        if: steps.detect.outputs.has_skills == 'true'
        shell: bash
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          mkdir -p "$temp_root/home" "$temp_root/project"
          cd "$temp_root/project"
          HOME="$temp_root/home" USERPROFILE="$temp_root/home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --all -y --copy
          while IFS= read -r skill_file; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            test -f "$temp_root/project/.agents/skills/$skill/SKILL.md"
          done < <(find "$GITHUB_WORKSPACE/skills" -mindepth 2 -maxdepth 2 -type f -name SKILL.md -print)
