name: Submit a community demo
description: Share a rig you made in Rigby2D on rigby2d.com/demos, with your name on it (free).
title: "Demo: "
labels: [demo-submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your work! Community demos show what Rigby2D can do and help others learn how a rig is built.
        We look at every submission and add it to rigby2d.com/demos/#community. The art must be your own and drawn by hand.
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Forest spirit
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Your name, as it should appear
      placeholder: Ada Lin
    validations:
      required: true
  - type: input
    id: author_url
    attributes:
      label: A link for your name
      description: Optional. Your portfolio, itch.io, X, ArtStation…
      placeholder: https://ada.art
  - type: textarea
    id: description
    attributes:
      label: What it shows
      description: One or two sentences. What is in the rig, what to look at (meshes, IK, physics, skins, an animation…).
    validations:
      required: true
  - type: dropdown
    id: tags
    attributes:
      label: Features
      multiple: true
      options: [Meshes, Weights, IK, Physics, Skins, Face poses, Lip-sync, Events, Scenes, Film effects, Pixel art, Walk cycle]
  - type: textarea
    id: files
    attributes:
      label: The project and a picture
      description: |
        Drag the `.rigby` file (zip it if GitHub refuses it) and a picture of the character (PNG or JPG, about 960x720) into this box.
        Too big for GitHub? Paste a download link instead (itch.io, Google Drive, your site).
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      description: How others may use your demo. CC BY 4.0 lets anyone use and change it, giving you credit.
      options:
        - CC BY 4.0 (use and change it, with credit)
        - CC BY-SA 4.0 (with credit, and changes shared the same way)
        - CC BY-NC 4.0 (with credit, not for commercial use)
        - CC0 (public domain, no conditions)
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting
      options:
        - Host the file on rigby2d.com
        - Link to my download only
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The art is mine (or I have the artist's permission) and drawn by hand, not generated by AI.
          required: true
        - label: I made the rig and animations in Rigby2D, and I may share them under the license above.
          required: true
        - label: rigby2d.com may show the picture, link or host the file, and credit me as above.
          required: true
