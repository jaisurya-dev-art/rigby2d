<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigby2D</title>
    <link rel="icon" type="image/svg+xml" href="/branding/rigby2d-icon-dark.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0b;
        color: #a9adb5;
        font: 11px system-ui, 'Segoe UI', sans-serif;
        user-select: none;
        cursor: default;
      }
      body {
        background:
          radial-gradient(60% 75% at 50% 52%, rgba(64, 140, 230, 0.16), transparent 70%),
          radial-gradient(50% 40% at 70% 50%, rgba(123, 167, 199, 0.07), transparent 70%),
          #0a0a0b;
      }
      #lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56%;
        transform: translate(-46%, -50%);
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        filter: drop-shadow(0 0 18px rgba(80, 160, 255, 0.35));
      }
      #lockup.reveal {
        transition:
          clip-path 0.55s cubic-bezier(0.2, 0.7, 0.2, 1),
          opacity 0.25s ease-out,
          transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
        clip-path: inset(0 0 0 0);
        opacity: 1;
        transform: translate(-50%, -50%);
      }
      #note {
        position: absolute;
        right: 14px;
        bottom: 10px;
        letter-spacing: 0.04em;
        transition: opacity 0.3s;
      }
      /* A community animation (src/splash/art/): played live, with the lockup top left and a Start button. */
      #art,
      #credit,
      #version,
      #start,
      #bar {
        display: none;
      }
      body.art {
        background:
          radial-gradient(55% 80% at 62% 55%, rgba(123, 167, 199, 0.16), transparent 70%),
          #0a0a0b;
      }
      body.art #note {
        display: none;
      }
      body.art #art {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      body.art #lockup {
        left: 28px;
        top: 24px;
        width: 46px;
        transform: none;
        opacity: 1;
        clip-path: none;
        filter: none;
      }
      body.art #credit {
        display: block;
        position: absolute;
        left: 32px;
        bottom: 22px;
        font-size: 11px;
        line-height: 1.5;
        color: #6b7079;
      }
      #credit b {
        display: block;
        color: #f4f4f5;
        font-size: 13px;
        font-weight: 600;
      }
      body.art #credit.headline {
        bottom: 26px;
        font-size: 15px;
        font-weight: 600;
        color: #f4f4f5;
        line-height: 1.05;
        animation: rise 0.7s cubic-bezier(0.2, 1.3, 0.35, 1) 0.3s both;
      }
      #credit.headline em {
        font-style: normal;
        color: #f08a3c;
      }
      #credit.headline b {
        margin-top: 2px;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #f08a3c;
        text-shadow: 0 0 28px rgba(240, 138, 60, 0.45);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.94);
        }
      }
      body.art #version {
        display: block;
        position: absolute;
        right: 28px;
        top: 22px;
        color: #565a62;
      }
      body.art #start {
        display: block;
        position: absolute;
        right: 26px;
        bottom: 22px;
        font: 600 13px system-ui, 'Segoe UI', sans-serif;
        color: #6b7079;
        background: #26272b;
        border: 0;
        border-radius: 8px;
        padding: 10px 26px;
        pointer-events: none;
        transition:
          background 0.4s,
          color 0.4s;
      }
      body.art #start.ready {
        color: #0a0a0b;
        background: #f4f4f5;
        cursor: pointer;
        pointer-events: auto;
      }
      body.art #start.ready:hover {
        background: #b5d3e7;
      }
      body.art #start:focus-visible {
        outline: 2px solid #7ba7c7;
        outline-offset: 2px;
      }
      body.art #bar {
        display: block;
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0;
        background: #7ba7c7;
        transition:
          width 0.4s,
          opacity 0.4s;
      }
      body.leaving {
        transition: opacity 0.25s ease-in;
        opacity: 0;
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <canvas id="art"></canvas>
    <img id="lockup" alt="Rigby2D" draggable="false" />
    <div id="credit"></div>
    <div id="version"></div>
    <button id="start" type="button">Start</button>
    <div id="bar"></div>
    <div id="note">Loading…</div>
    <script type="module" src="/src/splash/splash.js"></script>
  </body>
</html>
